<!DOCTYPE html>
<html>
<head>
    <title>Start SMP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }

        body {
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #000);
            background-size:400% 400%;
            animation:bg 12s ease infinite;
            color:white;
            padding:20px;
        }

        @keyframes bg {
            0% {background-position:0% 50%}
            50% {background-position:100% 50%}
            100% {background-position:0% 50%}
        }

        .card {
            text-align:center;
            padding:30px 20px;
            border-radius:25px;
            background:rgba(0,0,0,0.85);
            backdrop-filter:blur(15px);
            box-shadow:0 0 50px rgba(0,255,200,0.15);
            width:100%;
            max-width:420px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .status-badge {
            display:inline-block;
            padding:8px 20px;
            border-radius:50px;
            font-size:12px;
            font-weight:bold;
            margin-bottom:25px;
            letter-spacing:1px;
            text-transform: uppercase;
        }

        .online { background:rgba(0,255,136,0.15); color:#00ff88; border:1px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.2); }
        .offline { background:rgba(255,75,43,0.15); color:#ff4b2b; border:1px solid #ff4b2b; }
        .checking { background:rgba(255,255,255,0.1); color:#fff; border:1px solid #fff; }

        h1 { font-size:26px; margin-bottom:20px; letter-spacing: -1px; }

        .section-title {
            font-size:11px;
            color:#00ffcc;
            text-align:left;
            margin:15px 0 8px 5px;
            font-weight:800;
            text-transform:uppercase;
            opacity: 0.8;
        }

        .copy-box {
            background:rgba(255,255,255,0.05);
            border-radius:12px;
            padding:12px 15px;
            margin-bottom:8px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border:1px solid rgba(255,255,255,0.05);
        }

        .copy-info { text-align: left; }
        .copy-label { font-size:10px; color:#888; display:block; text-transform: uppercase; }
        .copy-val { font-size:14px; font-family:'Courier New', monospace; color:#fff; font-weight: bold; }

        .mini-btn {
            background:#222;
            color:#00ffcc;
            border:1px solid #00ffcc;
            padding:6px 12px;
            border-radius:6px;
            font-size:10px;
            cursor:pointer;
            font-weight:bold;
            transition:0.2s;
        }

        .mini-btn:hover { background:#00ffcc; color:#000; }

        .start-btn {
            width:100%;
            padding:18px;
            font-size:18px;
            border:none;
            border-radius:50px;
            background:linear-gradient(45deg, #00ffcc, #00ff88);
            color:#000;
            font-weight:900;
            cursor:pointer;
            margin-top:25px;
            box-shadow:0 10px 20px rgba(0,255,204,0.2);
            transition:0.3s;
        }

        .start-btn:hover { transform:translateY(-3px); box-shadow:0 15px 30px rgba(0,255,204,0.4); }

        .note { margin-top:20px; font-size:12px; color:#555; }
    </style>
</head>
<body>

<div class="card">
    <div id="statusBadge" class="status-badge checking">CONNECTING...</div>
    
    <h1>🚀 START SMP</h1>

    <div class="section-title">Java Edition</div>
    <div class="copy-box">
        <div class="copy-info"><span class="copy-label">Address</span><span class="copy-val">xcool.falix.me</span></div>
        <button class="mini-btn" onclick="copy('xcool.falix.me', this)">COPY</button>
    </div>

    <div class="section-title">Bedrock / Pocket</div>
    <div class="copy-box">
        <div class="copy-info"><span class="copy-label">IP Address</span><span class="copy-val">168.119.78.155</span></div>
        <button class="mini-btn" onclick="copy('168.119.78.155', this)">COPY IP</button>
    </div>
    <div class="copy-box">
        <div class="copy-info"><span class="copy-label">Port</span><span class="copy-val">20001</span></div>
        <button class="mini-btn" onclick="copy('20001', this)">COPY PORT</button>
    </div>

    <button class="start-btn" onclick="startServer()">START SERVER</button>
    <p class="note">Status refreshes every 30 seconds.</p>
</div>

<script>
    const JAVA_IP = "xcool.falix.me";

    function startServer() {
        window.location.href = `https://falixnodes.net/startserver?ip=${JAVA_IP}`;
    }

    function copy(text, btn) {
        navigator.clipboard.writeText(text);
        const oldText = btn.innerText;
        btn.innerText = "COPIED!";
        setTimeout(() => { btn.innerText = oldText; }, 1500);
    }

    async function checkStatus() {
        const badge = document.getElementById('statusBadge');
        try {
            // We use the '2' endpoint for detailed JSON
            const res = await fetch(`https://api.mcsrvstat.us/2/${JAVA_IP}`);
            const data = await res.json();

            /* ALGORITHM TO DETECT FALIX HIBERNATION/PROXY:
               1. data.online must be true.
               2. If players.online is 0, we check the MOTD or Debug info.
               3. If the MOTD contains host-specific 'offline' text, we mark it offline.
            */
            
            const isOnline = data.online === true;
            const hasPlayers = data.players && data.players.max > 0;
            const motdText = (data.motd && data.motd.clean) ? data.motd.clean.join(' ').toLowerCase() : "";
            
            // Falix/Parking proxies often return 0 max players or a specific "starting" MOTD
            if (isOnline && hasPlayers && !motdText.includes("offline") && !motdText.includes("starting")) {
                badge.innerText = `● ONLINE | ${data.players.online} PLAYERS`;
                badge.className = "status-badge online";
            } else {
                badge.innerText = "● OFFLINE";
                badge.className = "status-badge offline";
            }
        } catch (err) {
            badge.innerText = "● OFFLINE";
            badge.className = "status-badge offline";
        }
    }

    checkStatus();
    setInterval(checkStatus, 30000); // Auto-refresh
</script>

</body>
</html>
