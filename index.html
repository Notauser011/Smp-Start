<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 SMP HUB | Premium Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffcc;
            --online: #00ff88;
            --offline: #ff4b2b;
            --checking: #ffcc00;
            --bg-dark: #050505;
            --card-bg: rgba(10, 15, 25, 0.7);
        }

        /* --- Beautiful Mesh Gradient Background --- */
        body {
            margin: 0;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 255, 204, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 255, 136, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(44, 83, 100, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: white;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- Entrance Animation --- */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card {
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            text-align: center;
            padding: 40px 25px;
            border-radius: 35px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 0 30px rgba(255,255,255,0.02);
            width: 100%;
            max-width: 420px;
            z-index: 10;
        }

        /* --- Animated Status Badge --- */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
        }

        /* Animated Dot */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            position: relative;
        }

        .status-dot::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: currentColor;
            animation: dot-pulse 2s infinite;
        }

        @keyframes dot-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }

        .online { color: var(--online); box-shadow: 0 0 20px rgba(0, 255, 136, 0.15); }
        .offline { color: var(--offline); }
        .checking { color: var(--checking); }

        h1 { font-size: clamp(32px, 10vw, 40px); margin-bottom: 25px; font-weight: 950; letter-spacing: -1.5px; }

        .section-title {
            font-size: 10px;
            color: var(--neon);
            text-align: left;
            margin: 18px 0 10px 15px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 800;
        }

        /* --- Copy Boxes --- */
        .copy-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 12px 12px 12px 22px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.2s, background 0.2s;
        }

        .copy-box:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(5px); }

        .copy-val { font-size: 14px; font-family: 'JetBrains Mono', monospace; color: #eee; }

        .mini-btn {
            background: var(--neon);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 900;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mini-btn:active { transform: scale(0.9); }

        /* --- Action Button --- */
        .start-btn {
            width: 100%;
            padding: 24px;
            font-size: 18px;
            border: none;
            border-radius: 22px;
            background: linear-gradient(90deg, #00ffcc, #00ff88, #00ffcc);
            background-size: 200% auto;
            color: #000;
            font-weight: 900;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 15px 40px rgba(0, 255, 204, 0.25);
            transition: 0.4s;
            animation: shine 4s linear infinite;
        }

        .start-btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 20px 50px rgba(0, 255, 204, 0.4); }

        /* --- Player List UI --- */
        #playerListContainer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            margin-top: 15px;
        }

        #playerListContainer.show { max-height: 200px; padding: 15px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.05); }

        .player-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            margin: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shine { to { background-position: 200% center; } }
    </style>
</head>
<body onclick="tryInitAudio()">

<div class="card">
    <div id="statusBadge" class="status-badge checking">
        <span class="status-dot"></span>
        <span id="statusText">INITIALIZING...</span>
    </div>
    
    <h1>🚀 SMP HUB</h1>

    <div class="section-title">Java Connection</div>
    <div class="copy-box">
        <span class="copy-val">xcool.falix.me</span>
        <button class="mini-btn" onclick="copyIP('xcool.falix.me', this, 'COPY')">COPY</button>
    </div>

    <div class="section-title">Bedrock Edition</div>
    <div class="copy-box">
        <span class="copy-val">168.119.78.155</span>
        <button class="mini-btn" onclick="copyIP('168.119.78.155', this, 'IP')">IP</button>
    </div>
    <div class="copy-box">
        <span class="copy-val">Port: 20001</span>
        <button class="mini-btn" onclick="copyIP('20001', this, 'PORT')">PORT</button>
    </div>

    <div id="playerListContainer">
        <div style="font-size: 10px; opacity: 0.5; margin-bottom: 10px; text-transform: uppercase;">Current Explorers:</div>
        <div id="playerList"></div>
    </div>

    <button class="start-btn" onclick="handleStart()">START SERVER</button>
</div>

<script>
    let audioCtx;

    // --- Audio System (Now triggered by first click) ---
    function tryInitAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            playTone(600, 0.1, 'sine', 0.1);
        }
    }

    function playTone(freq, duration, type, volume) {
        if (!audioCtx || audioCtx.state === 'suspended') {
            audioCtx?.resume();
        }
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function copyIP(text, btn, originalText) {
        tryInitAudio();
        navigator.clipboard.writeText(text);
        playTone(900, 0.1, 'sine', 0.2);
        btn.innerText = "COPIED!";
        btn.style.background = "#fff";
        setTimeout(() => { btn.innerText = originalText; btn.style.background = ""; }, 1500);
    }

    function handleStart() {
        tryInitAudio();
        playTone(200, 0.1, 'square', 0.1);
        setTimeout(() => playTone(400, 0.3, 'square', 0.1), 80);
        setTimeout(() => window.location.href = "https://falixnodes.net/startserver?ip=xcool.falix.me", 400);
    }

    // --- Dynamic Status Engine ---
    async function updateStatus() {
        const badge = document.getElementById('statusBadge');
        const text = document.getElementById('statusText');
        const pList = document.getElementById('playerList');
        const pContainer = document.getElementById('playerListContainer');

        try {
            const res = await fetch(`https://api.mcsrvstat.us/2/xcool.falix.me`);
            const data = await res.json();
            
            // Falix Logic: Check MOTD and player count
            const motd = data.motd?.clean ? (Array.isArray(data.motd.clean) ? data.motd.clean.join(' ') : data.motd.clean) : "";
            const isOfflineMOTD = motd.includes("OFFLINE") || motd.includes("Start the server");
            
            if (data.online && !isOfflineMOTD && data.players?.max > 0) {
                badge.className = "status-badge online";
                text.innerText = `ONLINE: ${data.players.online}/${data.players.max}`;
                
                // Player List Rendering
                if (data.players.list && data.players.list.length > 0) {
                    pList.innerHTML = data.players.list.map(p => `<span class="player-tag">${p}</span>`).join('');
                    pContainer.classList.add('show');
                } else {
                    pContainer.classList.remove('show');
                }
            } else {
                badge.className = "status-badge offline";
                text.innerText = "OFFLINE";
                pContainer.classList.remove('show');
            }
        } catch (e) {
            badge.className = "status-badge checking";
            text.innerText = "RECONNECTING...";
        }
    }

    // Initial check and interval
    updateStatus();
    setInterval(updateStatus, 30000);
</script>

</body>
</html>
