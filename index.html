<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 SMP HUB | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffcc;
            --online: #00ff88;
            --offline: #ff4b2b;
            --checking: #ffcc00;
            --glass: rgba(255, 255, 255, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        /* --- Lively Animated Background --- */
        body {
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050a0f;
            overflow: hidden;
            padding: 15px;
            perspective: 1000px;
        }

        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.6;
        }

        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            animation: drift 20s infinite alternate;
        }

        .blob-1 { background: var(--neon); top: -10%; left: -10%; animation-delay: 0s; }
        .blob-2 { background: #2c5364; bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { background: #00ff88; top: 40%; left: 30%; width: 200px; height: 200px; animation: drift 15s infinite reverse; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 50px) scale(1.2); }
        }

        /* --- Re-scaled Card (380px) --- */
        .card {
            width: 100%;
            max-width: 380px;
            padding: 30px 22px;
            background: rgba(10, 15, 20, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px) rotateX(-10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        /* --- Animated Status Badge --- */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 900;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            position: relative;
        }

        .dot::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: currentColor;
            animation: ping 1.5s infinite;
        }

        @keyframes ping {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        .online { color: var(--online); background: rgba(0, 255, 136, 0.1); }
        .offline { color: var(--offline); background: rgba(255, 75, 43, 0.1); }
        .checking { color: var(--checking); background: rgba(255, 204, 0, 0.1); }

        h1 { font-size: 28px; font-weight: 950; margin-bottom: 20px; letter-spacing: -1px; }

        .section-label {
            font-size: 9px;
            color: var(--neon);
            text-align: left;
            margin: 15px 0 8px 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            opacity: 0.8;
        }

        .copy-row {
            background: var(--glass);
            padding: 8px 8px 8px 18px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }

        .copy-row:hover { background: rgba(255,255,255,0.1); }

        .val { font-size: 13px; font-family: 'JetBrains Mono', monospace; color: #fff; }

        .btn-copy {
            background: var(--neon);
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        /* --- Player List UI --- */
        #playerListWrap {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            margin-top: 10px;
        }

        #playerListWrap.active { max-height: 150px; margin-top: 15px; }

        #playerList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
        }

        .player {
            font-size: 11px;
            background: rgba(255,255,255,0.08);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .btn-start {
            width: 100%;
            padding: 20px;
            margin-top: 25px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(90deg, #00ffcc, #00ff88, #00ffcc);
            background-size: 200% auto;
            color: #000;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.2);
            animation: shine 3s linear infinite;
            transition: 0.3s;
        }

        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(0, 255, 204, 0.4); }

        @keyframes shine { to { background-position: 200% center; } }
    </style>
</head>
<body onclick="initAudio()">

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="card">
        <div id="badge" class="status-badge checking">
            <span class="dot"></span>
            <span id="badgeText">FETCHING...</span>
        </div>

        <h1>🚀 SMP HUB</h1>

        <div class="section-label">Java Edition</div>
        <div class="copy-row">
            <span class="val">xcool.falix.me</span>
            <button class="btn-copy" onclick="copy('xcool.falix.me', this, 'COPY')">COPY</button>
        </div>

        <div class="section-label">Bedrock Edition</div>
        <div class="copy-row">
            <span class="val">168.119.78.155</span>
            <button class="btn-copy" onclick="copy('168.119.78.155', this, 'IP')">IP</button>
        </div>
        <div class="copy-row">
            <span class="val">Port: 20001</span>
            <button class="btn-copy" onclick="copy('20001', this, 'PORT')">PORT</button>
        </div>

        <div id="playerListWrap">
            <div style="font-size: 9px; opacity: 0.4; margin-bottom: 8px;">ONLINE PLAYERS</div>
            <div id="playerList"></div>
        </div>

        <button class="btn-start" onclick="handleStart()">START SERVER</button>
    </div>

<script>
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            playSfx(500, 0.1, 'sine', 0.1);
        }
    }

    function playSfx(f, d, t, v) {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    function copy(t, b, o) {
        initAudio();
        navigator.clipboard.writeText(t);
        playSfx(800, 0.1, 'sine', 0.2);
        b.innerText = "DONE!";
        setTimeout(() => b.innerText = o, 1500);
    }

    function handleStart() {
        initAudio();
        playSfx(300, 0.4, 'square', 0.1);
        setTimeout(() => window.location.href = "https://falixnodes.net/startserver?ip=xcool.falix.me", 300);
    }

    async function check() {
        const b = document.getElementById('badge');
        const bt = document.getElementById('badgeText');
        const pw = document.getElementById('playerListWrap');
        const pl = document.getElementById('playerList');

        try {
            const r = await fetch('https://api.mcsrvstat.us/2/xcool.falix.me');
            const d = await r.json();
            
            // FalixNodes "Fake Online" Detection
            const motd = d.motd?.clean ? d.motd.clean.toString() : "";
            const isFake = motd.includes("OFFLINE") || motd.includes("Start the server");

            if (d.online && !isFake && d.players?.max > 0) {
                b.className = "status-badge online";
                bt.innerText = `ONLINE: ${d.players.online}/${d.players.max}`;
                
                if (d.players.list) {
                    pl.innerHTML = d.players.list.map(p => `<span class="player">${p}</span>`).join('');
                    pw.classList.add('active');
                } else {
                    pw.classList.remove('active');
                }
            } else {
                b.className = "status-badge offline";
                bt.innerText = "OFFLINE";
                pw.classList.remove('active');
            }
        } catch (e) {
            bt.innerText = "RETRYING...";
        }
    }

    check();
    setInterval(check, 30000);
</script>
</body>
</html>
