<!DOCTYPE html>
<html>
<head>
<title>SMP Server</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c1c1c);
background-size:400% 400%;
animation:bg 12s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
text-align:center;
padding:60px;
border-radius:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(25px);
box-shadow:0 0 80px rgba(0,255,200,0.25);
animation:fade 1.2s ease;
width:90%;
max-width:500px;
}

@keyframes fade{
from{opacity:0;transform:translateY(40px)}
to{opacity:1;transform:translateY(0)}
}

h1{
font-size:42px;
margin-bottom:10px;
}

.status{
margin-top:10px;
font-size:18px;
margin-bottom:35px;
}

.dot{
display:inline-block;
width:12px;
height:12px;
border-radius:50%;
margin-right:8px;
}

.online{background:#00ff88;box-shadow:0 0 15px #00ff88}
.offline{background:red;box-shadow:0 0 15px red}

button{
padding:22px 70px;
font-size:24px;
border:none;
border-radius:60px;
cursor:pointer;
background:linear-gradient(45deg,#00ffcc,#00ff88);
color:black;
font-weight:bold;
transition:0.3s;
box-shadow:0 0 25px #00ffcc;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 60px #00ffcc;
}

.small{
margin-top:25px;
font-size:14px;
color:#aaa;
}
</style>
</head>

<body>

<div class="card">
<h1>🚀 SMP Server</h1>

<div class="status" id="status">
<span class="dot offline"></span>Checking server...
</div>

<button onclick="startServer()">START SERVER</button>

<div class="small">If offline, press start and wait 1-2 min</div>
</div>

<script>
const serverIP = "xcool.falix.me"; // CHANGE THIS

async function checkStatus(){
try{
let res = await fetch(`https://api.mcsrvstat.us/2/${serverIP}`);
let data = await res.json();

let statusDiv = document.getElementById("status");

if(data.online){
statusDiv.innerHTML =
'<span class="dot online"></span>Server Online';
}else{
statusDiv.innerHTML =
'<span class="dot offline"></span>Server Offline';
}
}catch{
document.getElementById("status").innerHTML =
'<span class="dot offline"></span>Status unknown';
}
}

function startServer(){
window.location.href =
`https://falixnodes.net/startserver?ip=${serverIP}`;
}

checkStatus();
setInterval(checkStatus,15000);
</script>

</body>
</html>
