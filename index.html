<!DOCTYPE html>
<html>
<head>
    <title>Start SMP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --neon: #00ffcc;
            --online: #00ff88;
            --offline: #ff4b2b;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f2027, #2c5364, #203a43, #000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow: hidden;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            text-align: center;
            padding: 30px 20px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .online { background: #00ff881a; color: var(--online); border: 1px solid var(--online); box-shadow: 0 0 15px #00ff8833; }
        .offline { background: #ff4b2b1a; color: var(--offline); border: 1px solid var(--offline); }

        h1 { font-size: clamp(24px, 8vw, 30px); margin-bottom: 20px; font-weight: 900; }

        .section-title {
            font-size: 9px;
            color: var(--neon);
            text-align: left;
            margin: 12px 0 6px 15px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .copy-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            padding: 8px 8px 8px 20px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .copy-val { font-size: 13px; font-family: monospace; font-weight: 600; color: #fff; }

        .mini-btn {
            background: linear-gradient(45deg, #00ffcc, #00ff88);
            color: #000;
            border: none;
            padding: 12px 18px; /* Larger touch target for mobile */
            border-radius: 100px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 900;
        }

        .start-btn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 100px;
            background: linear-gradient(90deg, #00ffcc, #00ff88, #00ffcc);
            background-size: 200% auto;
            color: #000;
            font-weight: 950;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(0, 255, 204, 0.3);
            animation: shine 3s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        /* Mobile Audio Prompt Overlay */
        #audioPrompt {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="audioPrompt" onclick="initAudio()">
    <p>Tap to Enter Hub</p>
    <span style="font-size: 12px; color: var(--neon); margin-top: 10px;">(Enables Game Sounds)</span>
</div>

<div class="card">
    <div id="statusBadge" class="status-badge offline">CONNECTING...</div>
    
    <h1>🚀 SMP HUB</h1>

    <div class="section-title">Java Connection</div>
    <div class="copy-box">
        <span class="copy-val">xcool.falix.me</span>
        <button class="mini-btn" onclick="copyIP('xcool.falix.me', this)">COPY</button>
    </div>

    <div class="section-title">Bedrock Edition</div>
    <div class="copy-box">
        <span class="copy-val">168.119.78.155</span>
        <button class="mini-btn" onclick="copyIP('168.119.78.155', this)">IP</button>
    </div>
    <div class="copy-box">
        <span class="copy-val">Port: 20001</span>
        <button class="mini-btn" onclick="copyIP('20001', this)">PORT</button>
    </div>

    <button class="start-btn" onclick="handleStart()">START SERVER</button>
</div>

<script>
    let audioCtx;

    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('audioPrompt').style.display = 'none';
        playSound(600, 0.2, 'sine', 0.3); // Entry sound
    }

    function playSound(freq, duration, type, volume) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function copyIP(text, btn) {
        playSound(900, 0.1, 'sine', 0.5); // LOUDER COPY SOUND
        navigator.clipboard.writeText(text);
        btn.innerText = "DONE!";
        setTimeout(() => { btn.innerText = btn.innerText.includes("PORT") ? "PORT" : btn.innerText.includes("IP") ? "IP" : "COPY"; }, 1000);
    }

    function handleStart() {
        playSound(400, 0.4, 'square', 0.4); // POWERFUL START SOUND
        setTimeout(() => playSound(800, 0.4, 'square', 0.4), 100);
        setTimeout(() => {
            window.location.href = "https://falixnodes.net/startserver?ip=xcool.falix.me";
        }, 400);
    }

    async function checkStatus() {
        const badge = document.getElementById('statusBadge');
        try {
            const res = await fetch(`https://api.mcsrvstat.us/2/xcool.falix.me`);
            const data = await res.json();
            if (data.online === true && data.players && data.players.max > 0) {
                badge.innerText = `● ONLINE: ${data.players.online}/${data.players.max}`;
                badge.className = "status-badge online";
            } else {
                badge.innerText = "● SERVER OFFLINE";
                badge.className = "status-badge offline";
            }
        } catch (err) {
            badge.innerText = "● OFFLINE";
            badge.className = "status-badge offline";
        }
    }

    checkStatus();
    setInterval(checkStatus, 30000);
</script>

</body>
</html>
