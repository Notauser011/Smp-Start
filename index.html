<!DOCTYPE html>
<html>
<head>
<title>Start SMP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000);
background-size:400% 400%;
animation:bg 12s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
text-align:center;
padding:40px 25px;
border-radius:25px;
background:rgba(0,0,0,0.65);
backdrop-filter:blur(14px);
box-shadow:0 0 60px rgba(0,255,200,0.25);
width:92%;
max-width:420px;
}

h1{
font-size:32px;
margin-bottom:10px;
}

p{
color:#ccc;
margin-bottom:35px;
font-size:16px;
}

button{
width:100%;
padding:22px 0;
font-size:22px;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#00ffcc,#00ff88);
color:black;
font-weight:bold;
cursor:pointer;
transition:0.25s;
box-shadow:0 0 25px #00ffcc;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 60px #00ffcc;
}

.note{
margin-top:18px;
font-size:13px;
color:#aaa;
}

@media(max-width:500px){
h1{font-size:26px}
button{font-size:20px;padding:20px 0}
}
</style>
</head>

<body>

<div class="card">
<h1>🚀 Start SMP</h1>
<p>If server is offline, press start below</p>

<button onclick="startServer()">START SERVER</button>

<div class="note">Wait 1–2 minutes then join Minecraft</div>
</div>

<script>
function startServer(){
window.location.href="https://falixnodes.net/startserver?ip=xcool.falix.me";
}
</script>

</body>
</html>
