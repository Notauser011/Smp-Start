<!DOCTYPE html>
<html>
<head>
    <title>Start SMP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --neon: #00ffcc;
            --bg-dark: #050505;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Outfit', 'Segoe UI', sans-serif; }

        /* Animated Gradient Background */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f2027, #2c5364, #203a43, #000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            text-align: center;
            padding: 45px 35px;
            border-radius: 50px; /* Super Round */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.5s;
        }

        .online { background: #00ff881a; color: #00ff88; border: 1px solid #00ff88; box-shadow: 0 0 20px #00ff8833; }
        .offline { background: #ff4b2b1a; color: #ff4b2b; border: 1px solid #ff4b2b; }

        h1 { font-size: 34px; margin-bottom: 30px; font-weight: 900; letter-spacing: -1.5px; }

        .section-title {
            font-size: 10px;
            color: var(--neon);
            text-align: left;
            margin: 0 0 10px 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .copy-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            padding: 12px 12px 12px 25px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: 0.3s;
        }

        .copy-box:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--neon); }

        .copy-val { font-size: 14px; font-family: 'Monaco', monospace; font-weight: 600; color: #eee; }

        .mini-btn {
            background: linear-gradient(45deg, #00ffcc, #00ff88);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 900;
            transition: 0.2s ease;
        }

        .mini-btn:hover { transform: scale(1.08); filter: brightness(1.2); }

        .start-btn {
            width: 100%;
            padding: 24px;
            font-size: 22px;
            border: none;
            border-radius: 100px;
            background: linear-gradient(90deg, #00ffcc, #00ff88, #00ffcc);
            background-size: 200% auto;
            color: #000;
            font-weight: 950;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 15px 35px rgba(0, 255, 204, 0.3);
            transition: 0.4s;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .start-btn:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 20px 50px rgba(0, 255, 204, 0.5); 
        }

        .note { margin-top: 25px; font-size: 11px; color: rgba(255, 255, 255, 0.3); letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="card">
    <div id="statusBadge" class="status-badge offline">SYNCING...</div>
    
    <h1>🚀 SMP HUB</h1>

    <div class="section-title">Java Edition</div>
    <div class="copy-box">
        <span class="copy-val">xcool.falix.me</span>
        <button class="mini-btn" onclick="copyIP('xcool.falix.me', this)">COPY</button>
    </div>

    <div class="section-title">Bedrock Edition</div>
    <div class="copy-box">
        <span class="copy-val">168.119.78.155</span>
        <button class="mini-btn" onclick="copyIP('168.119.78.155', this)">IP</button>
    </div>
    <div class="copy-box">
        <span class="copy-val">Port: 20001</span>
        <button class="mini-btn" onclick="copyIP('20001', this)">PORT</button>
    </div>

    <button class="start-btn" onclick="handleStart()">START SERVER</button>
    <p class="note">Status updates live every 30s</p>
</div>

<script>
    // --- WEBAUDIO SOUND ENGINE ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(freq, duration, type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // --- LOGIC ---
    function copyIP(text, btn) {
        playSound(800, 0.1, 'sine');
        navigator.clipboard.writeText(text);
        const oldText = btn.innerText;
        btn.innerText = "DONE!";
        setTimeout(() => { btn.innerText = oldText; }, 1000);
    }

    function handleStart() {
        playSound(500, 0.3, 'triangle');
        setTimeout(() => playSound(1000, 0.3, 'triangle'), 100);
        setTimeout(() => {
            window.location.href = "https://falixnodes.net/startserver?ip=xcool.falix.me";
        }, 300);
    }

    async function checkStatus() {
        const badge = document.getElementById('statusBadge');
        try {
            const res = await fetch(`https://api.mcsrvstat.us/2/xcool.falix.me`);
            const data = await res.json();
            
            // Accurate online check for FalixNodes
            if (data.online === true && data.players && data.players.max > 0) {
                badge.innerText = `● ONLINE: ${data.players.online}/${data.players.max}`;
                badge.className = "status-badge online";
            } else {
                badge.innerText = "● SERVER OFFLINE";
                badge.className = "status-badge offline";
            }
        } catch (err) {
            badge.innerText = "● OFFLINE";
            badge.className = "status-badge offline";
        }
    }

    checkStatus();
    setInterval(checkStatus, 30000);
</script>

</body>
</html>
