<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚀 SMP HUB | Premium v3</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
:root {
--neon:#00ffcc;
--online:#00ff88;
--offline:#ff4b2b;
--checking:#ffcc00;
--glass:rgba(255,255,255,0.06);
--card-width:400px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent}

body{
height:100dvh;
display:flex;
justify-content:center;
align-items:center;
background:#03070a;
overflow:hidden;
padding:20px;
}

.bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;filter:blur(90px);opacity:0.5}
.aura{position:absolute;width:350px;height:350px;border-radius:50%;animation:drift 25s infinite alternate ease-in-out}
.aura-1{background:var(--neon);top:-5%;left:-5%}
.aura-2{background:#2c5364;bottom:-5%;right:-5%;animation-delay:-7s}
.aura-3{background:#00ff88;top:40%;left:30%;width:250px;height:250px}

@keyframes drift{
0%{transform:translate(0,0) scale(1)}
100%{transform:translate(120px,60px) scale(1.1)}
}

.card{
width:100%;
max-width:var(--card-width);
min-height:580px;
background:rgba(8,12,18,0.8);
backdrop-filter:blur(35px);
border-radius:40px;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 30px 70px rgba(0,0,0,0.7);
display:flex;
flex-direction:column;
overflow:hidden;
}

nav{
display:flex;
padding:20px 20px 10px;
gap:10px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.nav-btn{
flex:1;
padding:10px;
border-radius:12px;
border:none;
background:rgba(255,255,255,0.03);
color:rgba(255,255,255,0.5);
font-size:11px;
font-weight:800;
cursor:pointer;
transition:0.3s;
text-transform:uppercase;
letter-spacing:1px;
}

.nav-btn.active{
background:rgba(0,255,204,0.1);
color:var(--neon);
}

.page{
display:none;
padding:25px;
flex:1;
overflow-y:auto;
}

.page.active{display:block}

.status-badge{
display:inline-flex;
align-items:center;
gap:8px;
padding:8px 18px;
border-radius:100px;
font-size:10px;
font-weight:900;
margin-bottom:20px;
letter-spacing:1.5px;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:currentColor;
position:relative;
}

.dot::after{
content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border-radius:50%;
background:currentColor;
animation:ping 2s infinite;
}

@keyframes ping{
0%{transform:scale(1);opacity:0.6}
100%{transform:scale(3.5);opacity:0}
}

.online{color:var(--online);background:rgba(0,255,136,0.08)}
.offline{color:var(--offline);background:rgba(255,75,43,0.08)}
.checking{color:var(--checking);background:rgba(255,204,0,0.08)}

h1{
font-size:32px;
font-weight:950;
margin-bottom:20px;
text-align:center;
}

.section-label{
font-size:9px;
color:var(--neon);
margin:15px 0 8px 5px;
text-transform:uppercase;
letter-spacing:2px;
font-weight:800;
opacity:0.7;
}

.copy-row{
background:var(--glass);
padding:10px 10px 10px 18px;
border-radius:16px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:8px;
}

.val{
font-size:13px;
font-family:'JetBrains Mono',monospace;
color:#eee;
}

.btn-copy{
background:var(--neon);
border:none;
padding:10px 14px;
border-radius:10px;
font-size:9px;
font-weight:900;
cursor:pointer;
}

.footer-action{
padding:20px;
border-top:1px solid rgba(255,255,255,0.05);
}

.btn-start{
width:100%;
padding:20px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#00ffcc,#00ff88);
color:#000;
font-weight:900;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="bg-canvas">
<div class="aura aura-1"></div>
<div class="aura aura-2"></div>
<div class="aura aura-3"></div>
</div>

<div class="card">

<nav>
<button class="nav-btn active" onclick="showPage('hub')">Hub</button>
<button class="nav-btn" onclick="showPage('faq')">FAQ</button>
<button class="nav-btn" onclick="showPage('report')">Reports</button>
</nav>

<div id="hubPage" class="page active">

<div style="text-align:center">
<div id="badge" class="status-badge checking">
<span class="dot"></span>
<span id="badgeText">SYNCING...</span>
</div>
</div>

<h1>🚀 SMP HUB</h1>

<div class="section-label">Java Edition</div>

<div class="copy-row">
<span class="val">xcool.falix.me</span>
<button class="btn-copy" onclick="copy('xcool.falix.me',this,'COPY')">COPY</button>
</div>

<div class="section-label" style="margin-top:20px">Bedrock Edition</div>

<div class="copy-row">
<span class="val">Server Address: 168.119.78.155</span>
<button class="btn-copy" onclick="copy('168.119.78.155',this,'ADDRESS')">ADDRESS</button>
</div>

<div class="copy-row">
<span class="val">Port: 20001</span>
<button class="btn-copy" onclick="copy('20001',this,'PORT')">PORT</button>
</div>

</div>

<div id="faqPage" class="page">
<h2 style="margin-bottom:20px;text-align:center">Help Center</h2>

<div class="faq-item">
<div class="faq-q">Connection Error</div>
<div class="faq-a">Make sure the server is online and the address is correct.</div>
</div>

</div>

<div id="reportPage" class="page">
<h2 style="margin-bottom:20px;text-align:center">Issue Tracker</h2>
<p style="text-align:center">Report join problems here.</p>
</div>

<div class="footer-action">
<button class="btn-start" onclick="handleStart()">START SERVER</button>
</div>

</div>

<script>

function showPage(page){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))
document.getElementById(page+"Page").classList.add("active")
}

function copy(text,btn,label){
navigator.clipboard.writeText(text)
btn.innerText="COPIED!"
setTimeout(()=>btn.innerText=label,1500)
}

function handleStart(){
window.location.href="https://falixnodes.net/startserver?ip=xcool.falix.me"
}

async function checkStatus(){
try{
const r=await fetch("https://api.mcsrvstat.us/2/xcool.falix.me")
const d=await r.json()

const b=document.getElementById("badge")
const t=document.getElementById("badgeText")

if(d.online){
b.className="status-badge online"
t.innerText=`ONLINE: ${d.players.online}/${d.players.max}`
}else{
b.className="status-badge offline"
t.innerText="OFFLINE"
}

}catch{
document.getElementById("badgeText").innerText="ERROR"
}
}

checkStatus()
setInterval(checkStatus,30000)

</script>

</body>
</html>
