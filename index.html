<script>
const serverIP = "xcool.falix.me"; // put your IP here

async function checkStatus(){
try{
let res = await fetch(`https://api.mcsrvstat.us/2/${serverIP}`);
let data = await res.json();
let statusDiv = document.getElementById("status");

// TRUE ONLINE = has players + version + motd
if(data.online && data.version && data.motd){
statusDiv.innerHTML =
'<span class="dot online"></span>Server Online ('+(data.players?.online || 0)+' players)';
}
else if(data.online && !data.version){
statusDiv.innerHTML =
'<span class="dot offline"></span>Server Starting...';
}
else{
statusDiv.innerHTML =
'<span class="dot offline"></span>Server Offline';
}

}catch{
document.getElementById("status").innerHTML =
'<span class="dot offline"></span>Status error';
}
}

function startServer(){
window.location.href =
`https://falixnodes.net/startserver?ip=${serverIP}`;
}

checkStatus();
setInterval(checkStatus,10000);
</script>
