<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 SMP HUB | Premium v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffcc;
            --online: #00ff88;
            --offline: #ff4b2b;
            --checking: #ffcc00;
            --glass: rgba(255, 255, 255, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #03070a;
            overflow: hidden;
            padding: 20px;
        }

        /* --- Lively Background --- */
        .bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(90px);
            opacity: 0.5;
        }

        .aura {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            animation: drift 25s infinite alternate ease-in-out;
        }

        .aura-1 { background: var(--neon); top: -5%; left: -5%; }
        .aura-2 { background: #2c5364; bottom: -5%; right: -5%; animation-delay: -7s; }
        .aura-3 { background: #00ff88; top: 40%; left: 30%; width: 250px; height: 250px; animation-duration: 18s; }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(120px, 60px) scale(1.1) rotate(15deg); }
        }

        /* --- Refined Card (+5% Size) --- */
        .card {
            width: 100%;
            max-width: 400px; /* Increased from 380px */
            padding: 35px 28px;
            background: rgba(8, 12, 18, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 38px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            box-shadow: 0 30px 70px rgba(0,0,0,0.7), inset 0 0 20px rgba(255,255,255,0.01);
            animation: entrance 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes entrance {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- Status Badge --- */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: currentColor;
            position: relative;
        }

        .dot::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: currentColor;
            animation: ping 2s infinite;
        }

        @keyframes ping {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        .online { color: var(--online); background: rgba(0, 255, 136, 0.08); }
        .offline { color: var(--offline); background: rgba(255, 75, 43, 0.08); }
        .checking { color: var(--checking); background: rgba(255, 204, 0, 0.08); }

        h1 { font-size: 32px; font-weight: 950; margin-bottom: 25px; letter-spacing: -1.2px; }

        /* --- Spacing & Sections --- */
        .section-label {
            font-size: 10px;
            color: var(--neon);
            text-align: left;
            margin: 14px 0 8px 12px;
            text-transform: uppercase;
            letter-spacing: 2.2px;
            font-weight: 800;
            opacity: 0.7;
        }

        .bedrock-section { margin-top: 24px; } /* Added spacing between editions */

        .copy-row {
            background: var(--glass);
            padding: 10px 10px 10px 20px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s, transform 0.2s;
        }

        .copy-row:hover { background: rgba(255,255,255,0.1); transform: translateX(4px); }

        .val { font-size: 14px; font-family: 'JetBrains Mono', monospace; color: #fff; }

        .btn-copy {
            background: var(--neon);
            border: none;
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-copy:active { transform: scale(0.9); }

        /* --- Player List --- */
        #playerWrap {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s ease;
        }

        #playerWrap.active { max-height: 180px; margin-top: 20px; }

        #playerList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(0,0,0,0.25);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .player {
            font-size: 11px;
            background: rgba(255,255,255,0.08);
            padding: 5px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* --- Action Button (Toned Down Glow) --- */
        .btn-start {
            width: 100%;
            padding: 22px;
            margin-top: 30px;
            border: none;
            border-radius: 22px;
            background: linear-gradient(90deg, #00ffcc, #00ff88, #00ffcc);
            background-size: 200% auto;
            color: #000;
            font-weight: 900;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 255, 204, 0.12); /* Reduced opacity and spread */
            animation: shine 4s linear infinite;
            transition: 0.4s ease;
        }

        .btn-start:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 12px 30px rgba(0, 255, 204, 0.2); 
        }

        @keyframes shine { to { background-position: 200% center; } }
    </style>
</head>
<body onclick="initAudio()">

    <div class="bg-canvas">
        <div class="aura aura-1"></div>
        <div class="aura aura-2"></div>
        <div class="aura aura-3"></div>
    </div>

    <div class="card">
        <div id="badge" class="status-badge checking">
            <span class="dot"></span>
            <span id="badgeText">SYNCING...</span>
        </div>

        <h1>🚀 SMP HUB</h1>

        <div class="section-label">Java Edition</div>
        <div class="copy-row">
            <span class="val">xcool.falix.me</span>
            <button class="btn-copy" onclick="copy('xcool.falix.me', this, 'COPY')">COPY</button>
        </div>

        <div class="section-label bedrock-section">Bedrock Edition</div>
        <div class="copy-row">
            <span class="val">168.119.78.155</span>
            <button class="btn-copy" onclick="copy('168.119.78.155', this, 'IP')">IP</button>
        </div>
        <div class="copy-row">
            <span class="val">Port: 20001</span>
            <button class="btn-copy" onclick="copy('20001', this, 'PORT')">PORT</button>
        </div>

        <div id="playerWrap">
            <div style="font-size: 10px; opacity: 0.4; margin-bottom: 10px; letter-spacing: 1px;">ACTIVE PLAYERS</div>
            <div id="playerList"></div>
        </div>

        <button class="btn-start" onclick="handleStart()">START SERVER</button>
    </div>

<script>
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Subtly wake up audio
            playSfx(440, 0.1, 'sine', 0.05);
        }
    }

    function playSfx(f, d, t, v) {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    function copy(t, b, o) {
        initAudio();
        navigator.clipboard.writeText(t);
        playSfx(750, 0.15, 'sine', 0.15);
        b.innerText = "COPIED!";
        b.style.background = "#fff";
        setTimeout(() => { b.innerText = o; b.style.background = ""; }, 1500);
    }

    function handleStart() {
        initAudio();
        playSfx(250, 0.1, 'square', 0.1);
        setTimeout(() => playSfx(450, 0.4, 'square', 0.1), 100);
        setTimeout(() => window.location.href = "https://falixnodes.net/startserver?ip=xcool.falix.me", 400);
    }

    async function checkStatus() {
        const b = document.getElementById('badge');
        const bt = document.getElementById('badgeText');
        const pw = document.getElementById('playerWrap');
        const pl = document.getElementById('playerList');

        try {
            const r = await fetch('https://api.mcsrvstat.us/2/xcool.falix.me');
            const d = await r.json();
            
            // FalixNodes Logic: Verify MOTD isn't an "Offline" message
            const motdText = d.motd?.clean ? d.motd.clean.toString() : "";
            const isOfflineMessage = motdText.toUpperCase().includes("OFFLINE") || motdText.includes("Start the server");

            if (d.online && !isOfflineMessage && d.players?.max > 0) {
                b.className = "status-badge online";
                bt.innerText = `ONLINE: ${d.players.online}/${d.players.max}`;
                
                if (d.players.list && d.players.list.length > 0) {
                    pl.innerHTML = d.players.list.map(p => `<span class="player">${p}</span>`).join('');
                    pw.classList.add('active');
                } else {
                    pw.classList.remove('active');
                }
            } else {
                b.className = "status-badge offline";
                bt.innerText = "OFFLINE";
                pw.classList.remove('active');
            }
        } catch (e) {
            bt.innerText = "SYNC ERROR";
            b.className = "status-badge checking";
        }
    }

    checkStatus();
    setInterval(checkStatus, 30000);
</script>
</body>
</html>
