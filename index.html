<!DOCTYPE html>
<html>
<head>
    <title>Start SMP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --neon: #00ffcc;
            --bg: #0a0f12;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Outfit', 'Segoe UI', sans-serif; }

        body {
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: radial-gradient(circle at center, #1a2a33 0%, #050505 100%);
            color:white;
            overflow: hidden;
        }

        .card {
            text-align:center;
            padding:40px 30px;
            border-radius: 40px; /* Very Round */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 95%;
            max-width: 400px;
        }

        .status-badge {
            display:inline-block;
            padding:10px 25px;
            border-radius: 100px; /* pill shape */
            font-size:12px;
            font-weight:800;
            margin-bottom:25px;
            letter-spacing:1.5px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .online { background:#00ff8822; color:#00ff88; border:1px solid #00ff88; box-shadow: 0 0 20px #00ff8844; }
        .offline { background:#ff4b2b22; color:#ff4b2b; border:1px solid #ff4b2b; }

        h1 { font-size:32px; margin-bottom:25px; font-weight: 800; letter-spacing: -1px; }

        .section-title {
            font-size:10px;
            color: var(--neon);
            text-align:left;
            margin:0 0 8px 15px;
            text-transform:uppercase;
            letter-spacing: 1px;
        }

        .copy-box {
            background: rgba(255,255,255,0.06);
            border-radius: 50px; /* Ultra Round */
            padding:10px 10px 10px 20px;
            margin-bottom:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .copy-box:hover { border-color: var(--neon); background: rgba(0,255,204,0.05); }

        .copy-val { font-size:14px; font-family: 'Monaco', monospace; font-weight: 600; }

        .mini-btn {
            background: var(--neon);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.2s;
        }

        .mini-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--neon); }

        .start-btn {
            width:100%;
            padding:22px;
            font-size:20px;
            border:none;
            border-radius: 100px;
            background: linear-gradient(90deg, #00ffcc, #00ff88);
            color:#000;
            font-weight:900;
            cursor:pointer;
            margin-top:20px;
            box-shadow: 0 10px 30px rgba(0,255,204,0.3);
            animation: pulse 2s infinite;
            transition: 0.3s;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 10px 40px rgba(0,255,204,0.5); }
            100% { transform: scale(1); }
        }

        .start-btn:active { transform: scale(0.95); }

        .note { margin-top:20px; font-size:11px; color:rgba(255,255,255,0.3); }
    </style>
</head>
<body>

<div class="card">
    <div id="statusBadge" class="status-badge offline">... PINGING ...</div>
    
    <h1>🚀 SMP HUB</h1>

    <div class="section-title">Java Connection</div>
    <div class="copy-box">
        <span class="copy-val">xcool.falix.me</span>
        <button class="mini-btn" onclick="copyIP('xcool.falix.me', this)">COPY</button>
    </div>

    <div class="section-title">Bedrock Connection</div>
    <div class="copy-box">
        <span class="copy-val">168.119.78.155</span>
        <button class="mini-btn" onclick="copyIP('168.119.78.155', this)">IP</button>
    </div>
    <div class="copy-box">
        <span class="copy-val">Port: 20001</span>
        <button class="mini-btn" onclick="copyIP('20001', this)">PORT</button>
    </div>

    <button class="start-btn" onclick="handleStart()">START SERVER</button>
    <p class="note">Syncing with xcool.falix.me</p>
</div>

<script>
    // --- SYNTHETIC SOUND ENGINE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    // --- LOGIC ---
    function copyIP(text, btn) {
        playSound('click');
        navigator.clipboard.writeText(text);
        const originalText = btn.innerText;
        btn.innerText = "DONE!";
        setTimeout(() => { btn.innerText = originalText; }, 1000);
    }

    function handleStart() {
        playSound('success');
        setTimeout(() => {
            window.location.href = "https://falixnodes.net/startserver?ip=xcool.falix.me";
        }, 200);
    }

    async function checkStatus() {
        const badge = document.getElementById('statusBadge');
        try {
            const res = await fetch(`https://api.mcsrvstat.us/2/xcool.falix.me`);
            const data = await res.json();
            
            const isTrulyOnline = data.online === true && data.players && data.players.max > 0;
            
            if (isTrulyOnline) {
                badge.innerText = `● ONLINE: ${data.players.online}/${data.players.max}`;
                badge.className = "status-badge online";
            } else {
                badge.innerText = "● SERVER OFFLINE";
                badge.className = "status-badge offline";
            }
        } catch (err) {
            badge.innerText = "● OFFLINE";
            badge.className = "status-badge offline";
        }
    }

    checkStatus();
    setInterval(checkStatus, 20000);
</script>

</body>
</html>
